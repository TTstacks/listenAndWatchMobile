name: listenandwatch
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.5.1
  flick_video_player: ^0.9.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  http: ^1.5.0
